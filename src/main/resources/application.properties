spring.application.name=milk-store
# Cho phép upload ảnh sản phẩm tối đa 5MB/file, tối đa 20MB/request (nhiều ảnh cùng lúc)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# 1. Kết nối tới MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/milk_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# 2. Cấu hình Hibernate
# 'update' sẽ tự động tạo/cập nhật bảng dựa trên class Java (Entity)
spring.jpa.hibernate.ddl-auto=update

# 3. Hiển thị SQL ra Console để kiểm tra
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

